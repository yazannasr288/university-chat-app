name: alwatanyachat
description: "Alwatanya Chat - university communication and groups app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  firebase_core: ^4.9.0
  shared_preferences: ^2.5.3
  firebase_auth: ^6.5.1
  cloud_firestore: ^6.4.1
  image_picker: ^1.2.0
  firebase_storage: ^13.4.1
  video_player: ^2.10.1
  file_picker: ^10.3.1
  open_filex: ^4.7.0
  record: ^6.2.1
  just_audio: ^0.10.5
  permission_handler: ^12.0.1
  firebase_messaging: ^16.2.2
  webview_flutter: ^4.13.0
  url_launcher: ^6.3.2
  excel: ^4.0.6
  cloud_functions: ^6.3.1
  flutter_secure_storage: ^10.3.0
  uuid: ^4.5.3
  device_info_plus: ^12.4.0
  crypto: ^3.0.7
  easy_localization: ^3.0.8
  video_thumbnail: ^0.5.6
  cached_network_image: ^3.4.1
  path_provider: ^2.1.5
  hive_flutter: ^1.1.0
  shimmer: ^3.0.0
  intl: ^0.20.2
  flutter_local_notifications: ^19.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/translations/
    - assets/branding/alwatanya_chat_logo.png
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Cairo-Black.ttf
          weight: 900
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/alwatanya_chat_logo.png"
  remove_alpha_ios: true
  background_color_ios: "#063E75"
